name: Release

# Runs on `v*` tags (created by the Tag Release workflow when a PR merges
# to `main`, or dispatched by it explicitly since GITHUB_TOKEN-pushed tags
# don't re-trigger workflows). Full verification chain, provenance-signed
# npm publish, then a GitHub Release with notes from docs/changelog.md.
#
# Requires the `NPM_TOKEN` repository secret — an npm *automation* token
# scoped to publish @sentzunhat/zacatl (Settings -> Secrets -> Actions).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm --provenance attestation

jobs:
  cve-scan:
    name: CVE scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.3.0'
          cache: 'npm'

      # Must match the gate in cve-scan.yml exactly. If this scanned more than
      # the published package's production tree (e.g. every lockfile under
      # examples/), CI could go green and the release would then deadlock here
      # after the tag was already pushed.
      - name: Scan production dependencies for vulnerabilities
        shell: bash
        run: |
          set -uo pipefail
          echo "Scanning production dependencies (--omit=dev) with npm audit..."
          if npm audit --omit=dev --audit-level=high; then
            echo "🎉 Production dependencies audit passed."
          else
            echo "❌ Production dependencies have high-severity vulnerabilities."
            exit 1
          fi

  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    needs: [cve-scan]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.3.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Ref $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Check whether this version is already published
        id: published
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json 2>/dev/null || true)"
          if [ "${PUBLISHED_VERSION}" = "\"${PACKAGE_VERSION}\"" ] || [ "${PUBLISHED_VERSION}" = "${PACKAGE_VERSION}" ]; then
            echo "already=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; verification will run and publish will be skipped."
          else
            echo "already=false" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
          fi

      - name: Install dependencies
        run: npm ci

      # NPM_TOKEN is scoped to the publish step only — the verification chain
      # (tests, lint, build) runs arbitrary project code and must not see it.
      - name: Verify
        env:
          NODE_ENV: test
          ENV: test
          # The exact immutable version was checked against npm immediately
          # above. On recovery runs, allow only the guard's duplicate-version
          # check to pass so all other guard checks still execute.
          ALLOW_PUBLISHED_VERSION_RECOVERY: ${{ steps.published.outputs.already == 'true' && '1' || '0' }}
        run: npm run publish:ci:verify

      - name: Publish
        if: steps.published.outputs.already != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./publish --access public --tag latest --provenance

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists — nothing to create."
            exit 0
          fi
          awk "/^## \[${GITHUB_REF_NAME#v}\]/{flag=1; next} /^## \[/{flag=0} flag" docs/changelog.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No changelog section found for ${GITHUB_REF_NAME} — using generated notes." >&2
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md --title "${GITHUB_REF_NAME}"
          fi
