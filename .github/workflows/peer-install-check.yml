name: Peer install check

# Reusable component. Invoked by ci.yml — no push/pull_request triggers
# of its own so it can never double-fire alongside the orchestrator.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  peer-install:
    name: Install peers and verify imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      - name: Install devDependencies
        run: npm ci

      - name: Install peerDependencies declared in package.json
        run: npx tsx scripts/dev/install-peers.ts

      - name: Verify peers can be imported
        run: npx tsx scripts/dev/check-peers.ts
