name: Publish (dry-run)

# Reusable component. Invoked by ci.yml — no push/pull_request triggers
# of its own so it can never double-fire alongside the orchestrator.
#
# `publish:dry:ci` is the full verification chain: prepublish guard, tests,
# type check, lint, build, prepare-publish, packed consumer smokes, and
# `npm publish --dry-run`.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-dry:
    name: Dry-run publish and consumer smokes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['26.3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dry-publish flow
        env:
          NODE_ENV: test
          ENV: test
        run: npm run publish:dry:ci
