name: CI

# Single entry point for all branch/PR automation. Every check lives in a
# reusable workflow that has NO push/pull_request trigger of its own, so a
# given commit runs each check exactly once — this removes duplicate runs
# that came from combining `push: branches: ['**']` with `pull_request:`.
#
# What runs where:
#
#   pull_request -> dev|main : cve, peers                (fast gates)
#   push         -> dev      : not triggered (the open PR's pull_request run covers it)
#   push         -> main     : should-release -> cve, peers, [dry, docker if pending]
#   completed CI on main     : release-tag -> Release (merge-only release path)
#   schedule (weekly)        : cve, peers                (drift detection only)
#
# Push to dev does not trigger this workflow at all: dev is normally the
# source branch of an open PR, so every push to dev already fires a
# pull_request:synchronize event that runs the same checks. A push run used
# to start anyway just to skip cve/peers, which added a second, mostly
# skipped "(push)" check set to every dev -> main PR.
#
# `labeled` only matters for the opt-in labels (publish-dry-run,
# docker-smoke). Any other label gets its own concurrency group so it can't
# cancel an in-flight run, and every job skips.
#
# `should-release` answers "does package.json's version still need
# publishing?" before anything expensive runs. A push to main with no
# version bump (e.g. a docs-only follow-up commit after a release) has
# nothing to release, so dry/docker/tag all skip cleanly instead of dry
# failing loudly inside prepublish-guard.ts with "already published".
#
# Dry-run and docker are expensive and skipped on dev/schedule, and on main
# once the current version is already released. They run on pushes to main
# with a pending release to verify the full pipeline before tagging.
#
# Release tagging is intentionally handled by release-tag.yml after this
# workflow completes successfully on main. Keeping it in a separate workflow
# means PRs never show a skipped release job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch: {}

# Supersede in-flight runs for the same branch/PR instead of stacking them.
# For PRs: the PR number; for pushes/schedule: the branch name.
# A `labeled` event for a label other than the opt-in ones gets a unique
# group (its run id), so it never cancels the PR's real run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}${{ github.event.action == 'labeled' && github.event.label.name != 'publish-dry-run' && github.event.label.name != 'docker-smoke' && format('-ignored-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  should-release:
    name: Check pending release
    # Cheap, always runs (never skipped, except on an ignored `labeled` event
    # where the whole run is a no-op) so downstream `needs` never hits
    # skip-vs-success ambiguity. Answers one question early: does the version
    # on package.json still need to be published? A push to main that doesn't
    # bump the version (e.g. a docs-only follow-up) has nothing to release —
    # without this gate, `dry` used to find that out the expensive way, deep
    # inside prepublish-guard.ts, after cve/peers/dry had already spent CI
    # minutes on a run that was always going to fail.
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'publish-dry-run' || github.event.label.name == 'docker-smoke') }}
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags to check if this version was already released

      - name: Check whether this package.json version is already tagged
        id: check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${PKG_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — no release pending."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  cve:
    name: CVE scan
    # Runs on push to main (release gate), pull_request and schedule; skipped
    # only for labels other than the opt-in ones.
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'publish-dry-run' || github.event.label.name == 'docker-smoke') }}
    uses: ./.github/workflows/cve-scan.yml

  peers:
    name: Peer install check
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'publish-dry-run' || github.event.label.name == 'docker-smoke') }}
    uses: ./.github/workflows/peer-install-check.yml

  dry:
    name: Publish dry-run
    # Full verification (tests, type check, lint, build, consumer smokes).
    # Runs on a pending release push to main, or when a PR opts in with the
    # publish-dry-run label. Adding that label starts a fresh labeled event.
    needs: [should-release]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.should-release.outputs.pending == 'true') || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'publish-dry-run' || github.event.label.name == 'docker-smoke') && contains(github.event.pull_request.labels.*.name, 'publish-dry-run')) }}
    uses: ./.github/workflows/publish-dry.yml

  docker:
    name: Docker smoke
    # Expensive: eight example builds plus Postgres/Mongo services.
    # Runs on:
    #   - push to main with a pending release (release gate)
    #   - PRs with 'docker-smoke' label (opt-in testing)
    #   - Manual trigger from Actions tab (workflow_dispatch)
    # Skips on: dev pushes, schedule, PRs without label, main pushes with
    # no version bump (nothing to release, see `should-release`)
    needs: [should-release]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.should-release.outputs.pending == 'true') || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'publish-dry-run' || github.event.label.name == 'docker-smoke') && contains(github.event.pull_request.labels.*.name, 'docker-smoke')) }}
    uses: ./.github/workflows/docker-smoke.yml
