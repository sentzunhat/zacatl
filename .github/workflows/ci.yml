name: CI

# Single entry point for all branch/PR automation. Every check lives in a
# reusable workflow that has NO push/pull_request trigger of its own, so a
# given commit runs each check exactly once — this removes duplicate runs
# that came from combining `push: branches: ['**']` with `pull_request:`.
#
# What runs where:
#
#   pull_request -> dev|main : cve, peers                (fast gates)
#   push         -> dev      : (nothing — covered by the open PR's pull_request run)
#   push         -> main     : cve, peers, dry, docker -> tag -> Release
#   schedule (weekly)        : cve, peers                (drift detection only)
#
# Push to dev skips cve/peers: dev is normally the source branch of an open
# PR, so every push to dev already fires a pull_request:synchronize event
# that runs the same checks. Running them again on push was pure duplicate
# work — same commit, same result, twice.
#
# Dry-run and docker are expensive and skipped on dev/schedule. They only
# run on pushes to main (before release) to verify the full pipeline.
#
# The `tag` job gates publishing. It only runs on a push to main after all
# checks pass, so a red merge can never reach npm.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch: {}

# Supersede in-flight runs for the same branch/PR instead of stacking them.
# For PRs: github.head_ref = PR source branch (e.g., "dev")
# For pushes: github.ref_name = branch name (e.g., "dev", "refs/heads/..." stripped)
# This ensures both use the clean branch name and cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cve:
    name: CVE scan
    # Skip on push to dev — an open PR from dev already runs this via
    # pull_request:synchronize. Still runs on push to main (release gate),
    # pull_request, and schedule.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    uses: ./.github/workflows/cve-scan.yml

  peers:
    name: Peer install check
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    uses: ./.github/workflows/peer-install-check.yml

  dry:
    name: Publish dry-run
    # Full verification (tests, type check, lint, build, consumer smokes).
    # Expensive; only run on push to main before release.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/publish-dry.yml

  docker:
    name: Docker smoke
    # Expensive: three image builds plus Postgres/Mongo services.
    # Runs on:
    #   - push to main (release gate)
    #   - PRs with 'docker-test' label (opt-in testing)
    #   - Manual trigger from Actions tab (workflow_dispatch)
    # Skips on: dev pushes, schedule, PRs without label
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker-test')) }}
    uses: ./.github/workflows/docker-smoke.yml

  tag:
    name: Tag release
    # Release gate: only a real push to main. Depends on cve and peers which
    # always run; dry and docker are conditional but guaranteed to run on main.
    # Since tag also has the main condition, all four jobs are complete before
    # tag can run.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [cve, peers, dry, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the release tag
      actions: write # dispatch the Release workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to detect already-released versions

      # Tags pushed with the default GITHUB_TOKEN do not trigger other
      # workflows (GitHub anti-recursion), so Release is dispatched explicitly.
      - name: Create tag if missing and dispatch Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${PKG_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          gh workflow run release.yml --ref "${TAG}"
