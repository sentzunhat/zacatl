name: CI

# Single entry point for all branch/PR automation. Every check lives in a
# reusable workflow that has NO push/pull_request trigger of its own, so a
# given commit runs each check exactly once — this removes duplicate runs
# that came from combining `push: branches: ['**']` with `pull_request:`.
#
# What runs where:
#
#   pull_request -> dev|main : cve, peers                (fast gates)
#   push         -> dev      : (nothing — covered by the open PR's pull_request run)
#   push         -> main     : should-release -> cve, peers, [dry, docker if pending] -> tag -> Release
#   schedule (weekly)        : cve, peers                (drift detection only)
#
# Push to dev skips cve/peers: dev is normally the source branch of an open
# PR, so every push to dev already fires a pull_request:synchronize event
# that runs the same checks. Running them again on push was pure duplicate
# work — same commit, same result, twice.
#
# `should-release` answers "does package.json's version still need
# publishing?" before anything expensive runs. A push to main with no
# version bump (e.g. a docs-only follow-up commit after a release) has
# nothing to release, so dry/docker/tag all skip cleanly instead of dry
# failing loudly inside prepublish-guard.ts with "already published".
#
# Dry-run and docker are expensive and skipped on dev/schedule, and on main
# once the current version is already released. They run on pushes to main
# with a pending release to verify the full pipeline before tagging.
#
# The `tag` job gates publishing. It only runs on a push to main with a
# pending release, after all checks pass, so a red merge can never reach
# npm.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch: {}

# Supersede in-flight runs for the same branch/PR instead of stacking them.
# For PRs: github.head_ref = PR source branch (e.g., "dev")
# For pushes: github.ref_name = branch name (e.g., "dev", "refs/heads/..." stripped)
# This ensures both use the clean branch name and cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  should-release:
    name: Check pending release
    # Cheap, always runs (never skipped) so downstream `needs` never hits
    # skip-vs-success ambiguity. Answers one question early: does the version
    # on package.json still need to be published? A push to main that doesn't
    # bump the version (e.g. a docs-only follow-up) has nothing to release —
    # without this gate, `dry` used to find that out the expensive way, deep
    # inside prepublish-guard.ts, after cve/peers/dry had already spent CI
    # minutes on a run that was always going to fail.
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags to check if this version was already released

      - name: Check whether this package.json version is already tagged
        id: check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${PKG_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — no release pending."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  cve:
    name: CVE scan
    # Skip on push to dev — an open PR from dev already runs this via
    # pull_request:synchronize. Still runs on push to main (release gate),
    # pull_request, and schedule.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    uses: ./.github/workflows/cve-scan.yml

  peers:
    name: Peer install check
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    uses: ./.github/workflows/peer-install-check.yml

  dry:
    name: Publish dry-run
    # Full verification (tests, type check, lint, build, consumer smokes).
    # Runs on a pending release push to main, or when a PR opts in with the
    # publish-dry-run label. Adding that label starts a fresh labeled event.
    needs: [should-release]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.should-release.outputs.pending == 'true') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-dry-run')) }}
    uses: ./.github/workflows/publish-dry.yml

  docker:
    name: Docker smoke
    # Expensive: three image builds plus Postgres/Mongo services.
    # Runs on:
    #   - push to main with a pending release (release gate)
    #   - PRs with 'docker-smoke' label (opt-in testing)
    #   - Manual trigger from Actions tab (workflow_dispatch)
    # Skips on: dev pushes, schedule, PRs without label, main pushes with
    # no version bump (nothing to release, see `should-release`)
    needs: [should-release]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.should-release.outputs.pending == 'true') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker-smoke')) }}
    uses: ./.github/workflows/docker-smoke.yml

  tag:
    name: Tag release
    # Release gate: only a real push to main with a pending version bump.
    # `always()` plus explicit result checks because dry/docker may be
    # legitimately skipped (no pending release) rather than successful —
    # skipped is fine, failed is not.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.should-release.outputs.pending == 'true' && needs.cve.result == 'success' && needs.peers.result == 'success' && (needs.dry.result == 'success' || needs.dry.result == 'skipped') && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    needs: [should-release, cve, peers, dry, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the release tag
      actions: write # dispatch the Release workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags to detect already-released versions

      # Tags pushed with the default GITHUB_TOKEN do not trigger other
      # workflows (GitHub anti-recursion), so Release is dispatched explicitly.
      - name: Create tag if missing and dispatch Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${PKG_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          gh workflow run release.yml --ref "${TAG}"
